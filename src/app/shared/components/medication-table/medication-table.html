@if (medications().length === 0) {
  <p class="empty-state">Nema pronađenih lekova.</p>
} @else {
  <table class="table" [class.selectable]="selectable()">
    <thead>
    <tr>
      <th>Šifra</th>
      <th>Naziv</th>
      <th>INN</th>
      <th>Proizvođač</th>
    </tr>
    </thead>
    <tbody>
      @for (medication of medications(); track medication.id) {
        <tr (click)="rowClick.emit(medication)"
            [class.selected]="isSelected(medication)">
          <td>{{ medication.id }}</td>
          <td>{{ medication.name }}</td>
          <td>{{ medication.inn }}</td>
          <td>{{ medication.manufacturer }}</td>
        </tr>
      }
    </tbody>
  </table>
}
